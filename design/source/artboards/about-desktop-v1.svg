<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="2150" viewBox="0 0 1440 2150"><title>روزپوش — دربارهٔ ما</title><defs><style></style><image id="hero" width="1536" height="1024" href="../../assets/editorial-hero-v1.png"/><image id="products" width="1254" height="1254" href="../../assets/catalog-contact-sheet-v1.png"/></defs><rect x="0" y="0" width="1440" height="2150" rx="0" fill="#F7F5EF" stroke="none"/><rect x="0" y="0" width="1440" height="34" rx="0" fill="#4D593C" stroke="none"/><text x="720" y="23" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Yekan" font-size="13" font-weight="400" fill="#FFFFFF">روزپوش؛ برای روزهای معمولیِ دوست‌داشتنی</text><text x="1376" y="98" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="40" font-weight="700" fill="#242622">روزپوش</text><rect x="460" y="60" width="500" height="48" rx="0" fill="#EEEDE6" stroke="none"/><text x="932" y="91" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">دنبال چه لباسی می‌گردید؟</text><g transform="translate(479 73) scale(0.875)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16L21 21 M18 10A8 8 0 1 1 2 10A8 8 0 1 1 18 10"/></g><g transform="translate(70 75) scale(1.0)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8H19L20 21H4Z M9 8V6A3 3 0 0 1 15 6V8"/></g><text x="176" y="93" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#242622">سبد خرید</text><g transform="translate(225 75) scale(1.0)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7A4 4 0 1 1 8 7A4 4 0 1 1 16 7 M4 22V19C4 10 20 10 20 19V22"/></g><text x="360" y="93" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#242622">حساب کاربری</text><path d="M64 132L1376 132" stroke="#DADCD2" fill="none"/><text x="1376" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">تازه‌ها</text><text x="1276" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">زنانه</text><text x="1184" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">مردانه</text><text x="1088" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">لباس‌های پایه</text><text x="920" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">مجموعه‌ها</text><text x="64" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="end" font-family="Yekan" font-size="14" font-weight="400" fill="#64675E">راهنمای اندازه</text><path d="M64 194L1376 194" stroke="#DADCD2" fill="none"/><text x="1376" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#64675E">خانه  /  دربارهٔ ما</text><text x="1376" y="316" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="46" font-weight="700" fill="#242622">همراه روزهای تو.</text><text x="1376" y="357" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#64675E">روزپوش؛ نگاهی ساده‌تر به پوشیدن لباس‌های روزمره.</text><svg x="64" y="402" width="656" height="500" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMin slice"><use href="#hero"/></svg><text x="784" y="434" font-family="Yekan" font-size="12" fill="#64675E" letter-spacing="2">MADE FOR EVERYDAY MOMENTS</text><text x="1376" y="512" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="34" font-weight="700" fill="#242622">لباس برای زندگی،</text><text x="1376" y="560" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="34" font-weight="700" fill="#242622">با سلیقهٔ خودت.</text><text x="1376" y="624" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">بعضی لباس‌ها بی‌سروصدا بخشی از روز ما می‌شوند؛</text><text x="1376" y="659" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">پیراهنی که با آن راحتیم، شلواری که خوب می‌نشیند</text><text x="1376" y="694" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">یا بافتی که به ترکیب‌های آشنا حس تازه‌ای می‌دهد.</text><text x="1376" y="729" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">نگاه روزپوش از همین لحظه‌های کوچک شروع می‌شود.</text><text x="1376" y="804" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">در این نگاه، پوشاک زنانه و مردانه قرار است به کار</text><text x="1376" y="839" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">زندگی روزمره بیاید؛ ساده برای ترکیب کردن و همراه</text><text x="1376" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">با فضایی برای نشان دادن سلیقهٔ شخصی تو.</text><text x="1376" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="30" font-weight="700" fill="#242622">سه اصل برای انتخابی ساده‌تر</text><rect x="948" y="1032" width="428" height="210" rx="0" fill="#EAE6DA" stroke="none"/><text x="1348" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="600" fill="#4D593C">۰۱</text><text x="1348" y="1124" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="25" font-weight="600" fill="#242622">سادگی</text><text x="1348" y="1168" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">رنگ‌های آرام و جزئیات به‌اندازه؛</text><text x="1348" y="1199" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">لباس‌هایی که راحت کنار هم می‌نشینند.</text><rect x="506" y="1032" width="428" height="210" rx="0" fill="#EAE6DA" stroke="none"/><text x="906" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="600" fill="#4D593C">۰۲</text><text x="906" y="1124" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="25" font-weight="600" fill="#242622">کاربرد روزمره</text><text x="906" y="1168" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">از قرار کوتاه تا یک روز پُررفت‌وآمد؛</text><text x="906" y="1199" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">انتخاب را با ریتم روزت هماهنگ کن.</text><rect x="64" y="1032" width="428" height="210" rx="0" fill="#EAE6DA" stroke="none"/><text x="464" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="600" fill="#4D593C">۰۳</text><text x="464" y="1124" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="25" font-weight="600" fill="#242622">توجه به تن‌خور</text><text x="464" y="1168" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">به فرم، اندازه و آزادی حرکت دقت کن؛</text><text x="464" y="1199" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">لباس خوب باید روی تن تو راحت باشد.</text><path d="M64 1300L1376 1300" stroke="#DADCD2" fill="none"/><text x="1376" y="1360" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="30" font-weight="700" fill="#242622">از نگاه اول تا انتخاب تو</text><text x="1376" y="1410" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">یک انتخاب خوب از شناخت نیاز شروع می‌شود.</text><text x="1376" y="1445" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">پیش از اضافه کردن لباس تازه، به کمدی که داری</text><text x="1376" y="1480" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="400" fill="#242622">و موقعیت‌هایی که پیش روست فکر کن.</text><text x="1376" y="1576" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="600" fill="#4D593C">کمتر، بهتر، ماندگارتر.</text><text x="700" y="1398" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#4D593C">۰۱</text><text x="650" y="1398" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="600" fill="#242622">نیازت را مشخص کن</text><text x="650" y="1430" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">لباس را برای روز و موقعیتی که در پیش داری انتخاب کن.</text><text x="700" y="1480" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#4D593C">۰۲</text><text x="650" y="1480" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="600" fill="#242622">اندازه و جزئیات را ببین</text><text x="650" y="1512" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">راهنمای اندازه، فرم لباس و توضیحات آن را کنار هم بخوان.</text><text x="700" y="1562" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#4D593C">۰۳</text><text x="650" y="1562" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="600" fill="#242622">ترکیب خودت را بساز</text><text x="650" y="1594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">با لباس‌های کمدت مقایسه کن و جای تکهٔ تازه را پیدا کن.</text><rect x="64" y="1694" width="1312" height="116" rx="0" fill="#4D593C" stroke="none"/><text x="1328" y="1740" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="24" font-weight="600" fill="#FFFFFF">ترکیب بعدی‌ات از یک انتخاب ساده شروع می‌شود.</text><text x="1328" y="1778" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="400" fill="#E1E6D7">نگاهی به لباس‌های روزمره بینداز.</text><rect x="96" y="1728" width="204" height="48" rx="0" fill="#F7F5EF" stroke="none"/><text x="280" y="1759" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">دیدن فروشگاه</text><g transform="translate(112 1742) scale(0.8333333333333334)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4 M10 6L4 12L10 18"/></g><g transform="translate(0 -810)"><rect x="0" y="2698" width="1440" height="262" rx="0" fill="#242622" stroke="none"/><text x="1376" y="2775" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="38" font-weight="700" fill="#F7F5EF">روزپوش</text><text x="1376" y="2814" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="400" fill="#D5D9CE">پوشاک روزمره، با نگاهی ساده‌تر.</text><text x="1376" y="2845" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="400" fill="#D5D9CE">همراه روزهای تو.</text><text x="866" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">خرید</text><text x="866" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">زنانه</text><text x="866" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">مردانه</text><text x="866" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">لباس‌های پایه</text><text x="578" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">راهنمای خرید</text><text x="578" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">اندازه و تن‌خور</text><text x="578" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">ارسال و تعویض</text><text x="578" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">پرسش‌های متداول</text><text x="290" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">همراه روزپوش</text><text x="290" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">دربارهٔ ما</text><text x="290" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">تماس با ما</text><text x="290" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">پیگیری سفارش</text><path d="M64 2902L1376 2902" stroke="#4B5047" fill="none"/><text x="1376" y="2937" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="13" font-weight="400" fill="#D5D9CE">روزپوش © ۱۴۰۵</text><text x="64" y="2937" direction="rtl" unicode-bidi="plaintext" text-anchor="end" font-family="Yekan" font-size="13" font-weight="400" fill="#D5D9CE">حریم خصوصی  /  شرایط خرید</text></g></svg>