<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="2860" viewBox="0 0 1440 2860"><title>روزپوش — راهنمای استایل روزمره</title><defs><style></style><image id="hero" width="1536" height="1024" href="../../assets/editorial-hero-v1.png"/><image id="products" width="1254" height="1254" href="../../assets/catalog-contact-sheet-v1.png"/></defs><rect x="0" y="0" width="1440" height="2860" rx="0" fill="#F7F5EF" stroke="none"/><rect x="0" y="0" width="1440" height="34" rx="0" fill="#4D593C" stroke="none"/><text x="720" y="23" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Yekan" font-size="13" font-weight="400" fill="#FFFFFF">روزپوش؛ برای روزهای معمولیِ دوست‌داشتنی</text><text x="1376" y="98" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="40" font-weight="700" fill="#242622">روزپوش</text><rect x="460" y="60" width="500" height="48" rx="0" fill="#EEEDE6" stroke="none"/><text x="932" y="91" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="400" fill="#64675E">دنبال چه لباسی می‌گردید؟</text><g transform="translate(479 73) scale(0.875)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16L21 21 M18 10A8 8 0 1 1 2 10A8 8 0 1 1 18 10"/></g><g transform="translate(70 75) scale(1.0)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8H19L20 21H4Z M9 8V6A3 3 0 0 1 15 6V8"/></g><text x="176" y="93" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#242622">سبد خرید</text><g transform="translate(225 75) scale(1.0)" fill="none" stroke="#242622" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7A4 4 0 1 1 8 7A4 4 0 1 1 16 7 M4 22V19C4 10 20 10 20 19V22"/></g><text x="360" y="93" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#242622">حساب کاربری</text><path d="M64 132L1376 132" stroke="#DADCD2" fill="none"/><text x="1376" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">تازه‌ها</text><text x="1276" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">زنانه</text><text x="1184" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">مردانه</text><text x="1088" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">لباس‌های پایه</text><text x="920" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="16" font-weight="600" fill="#242622">مجموعه‌ها</text><text x="64" y="167" direction="rtl" unicode-bidi="plaintext" text-anchor="end" font-family="Yekan" font-size="14" font-weight="400" fill="#64675E">راهنمای اندازه</text><path d="M64 194L1376 194" stroke="#DADCD2" fill="none"/><text x="1376" y="233" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#64675E">خانه  /  راهنمای استایل  /  استایل روزمره</text><text x="1376" y="280" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="600" fill="#4D593C">راهنمای استایل</text><text x="1376" y="348" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="48" font-weight="700" fill="#242622">چطور با لباس‌های ساده،</text><text x="1376" y="410" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="48" font-weight="700" fill="#242622">استایل روزمره بسازیم؟</text><text x="1376" y="455" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#64675E">تحریریهٔ روزپوش  ·  ۲۱ آبان ۱۴۰۵</text><text x="288" y="280" font-family="Yekan" font-size="12" fill="#64675E" letter-spacing="2">THE EVERYDAY JOURNAL / 01</text><svg x="288" y="490" width="1088" height="560" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMin slice"><use href="#hero"/></svg><text x="1376" y="1080" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="13" font-weight="400" fill="#64675E">رنگ‌های خنثی و فرم‌های راحت؛ یک نقطهٔ شروع برای ترکیب‌های روزمره.</text><text x="1056" y="1150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="400" fill="#242622">برای خوش‌پوش بودن، همیشه به لباس‌های بیشتر نیاز نداریم. گاهی کافی است</text><text x="1056" y="1186" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="400" fill="#242622">همان لباس‌های آشنا را دقیق‌تر کنار هم بگذاریم. یک پیراهن ساده، شلواری با</text><text x="1056" y="1222" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="21" font-weight="400" fill="#242622">تن‌خور مناسب و چند رنگ هماهنگ می‌توانند شروع یک کمد کاربردی باشند.</text><path d="M1120 1130L1120 1476" stroke="#DADCD2" fill="none"/><text x="1376" y="1156" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="18" font-weight="600" fill="#242622">در این مطلب</text><text x="1376" y="1204" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#64675E">۱. از روز خودت شروع کن</text><text x="1376" y="1250" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#64675E">۲. رنگ‌ها را محدود کن</text><text x="1376" y="1296" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#64675E">۳. به تن‌خور دقت کن</text><text x="1376" y="1342" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="15" font-weight="400" fill="#64675E">۴. با لایه‌ها ترکیب بساز</text><text x="1056" y="1320" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="28" font-weight="700" fill="#242622">۱. از روز خودت شروع کن</text><text x="1056" y="1368" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">پیش از انتخاب لباس، به کارهایی فکر کن که قرار است انجام بدهی. برای یک روز</text><text x="1056" y="1404" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">پُررفت‌وآمد، آزادی حرکت مهم است؛ برای قرار کاری، شاید فرم مرتب‌تری بخواهی.</text><text x="1056" y="1440" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">لباس پایه را با همین نیاز انتخاب کن و بقیهٔ ترکیب را دور آن بساز. اگر بیشتر روز</text><text x="1056" y="1476" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">پشت میز هستی، راحتی لباس در حالت نشسته را هم بررسی کن. قرار نیست یک</text><text x="1056" y="1512" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">ترکیب برای همهٔ موقعیت‌ها جواب بدهد؛ کافی است با روز تو هماهنگ باشد.</text><text x="1056" y="1570" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="28" font-weight="700" fill="#242622">۲. رنگ‌ها را محدود، انتخاب‌ها را بیشتر کن</text><text x="1056" y="1618" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">برای شروع، دو رنگ خنثی و یک رنگ همراه کافی است. شیری و زغالی کنار هم</text><text x="1056" y="1654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">زمینه‌ای آرام می‌سازند و زیتونی می‌تواند رنگ سوم باشد. لازم نیست همهٔ لباس‌ها</text><text x="1056" y="1690" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">دقیقاً هم‌رنگ باشند؛ تفاوت روشنایی و بافت به ترکیب عمق می‌دهد. پیش از خرید،</text><text x="1056" y="1726" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">لباس تازه را در کنار دو تکه‌ای که از قبل داری تصور کن. اگر به‌راحتی با آن‌ها</text><text x="1056" y="1762" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">هماهنگ می‌شود، احتمالاً فرصت بیشتری برای پوشیدنش پیدا خواهی کرد.</text><text x="1056" y="1820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="28" font-weight="700" fill="#242622">۳. تن‌خور را جدی‌تر از برچسب اندازه بگیر</text><text x="1056" y="1868" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">یک لباس ساده وقتی خوب دیده می‌شود که روی بدن تو راحت بنشیند. سرشانه،</text><text x="1056" y="1904" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">قد آستین و محل قرار گرفتن کمر را بررسی کن. مدل آزاد باید فضای حرکت بدهد،</text><text x="1056" y="1940" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">بدون اینکه دست‌وپاگیر شود. هنگام امتحان کردن، بنشین و چند قدم راه برو؛</text><text x="1056" y="1976" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">اگر پارچه می‌کشد یا مدام مجبور به مرتب کردن لباس هستی، اندازه یا برش دیگری</text><text x="1056" y="2012" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">را امتحان کن. عدد روی برچسب، جای بررسی اندازه‌های واقعی را نمی‌گیرد.</text><text x="1056" y="2070" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="28" font-weight="700" fill="#242622">۴. با لایه‌ها یک ترکیب تازه بساز</text><text x="1056" y="2118" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">روی یک تیشرت ساده، پیراهنی باز یا یک بافت سبک بپوش تا ترکیب آشنا شکل</text><text x="1056" y="2154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">تازه‌ای بگیرد. اگر بالاتنه آزاد است، به حجم شلوار هم توجه کن و تعادل دلخواهت</text><text x="1056" y="2190" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">را جلوی آینه پیدا کن. برای نمونه، پیراهن شیری و شلوار زغالی می‌توانند با یک</text><text x="1056" y="2226" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">لایهٔ زیتونی همراه شوند. در پایان، یک جزئیات را کم کن و دوباره نگاه کن؛</text><text x="1056" y="2262" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="400" fill="#242622">سادگی وقتی کاربردی است که هنوز حس و سلیقهٔ خودت در آن دیده شود.</text><rect x="288" y="2328" width="768" height="118" rx="0" fill="#E8ECDF" stroke="none"/><text x="1032" y="2366" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="19" font-weight="600" fill="#4D593C">یک تمرین کوچک برای فردا</text><text x="1032" y="2401" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="18" font-weight="400" fill="#242622">سه لباس از کمدت انتخاب کن و دو ترکیب متفاوت با آن‌ها بساز.</text><text x="1032" y="2431" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="18" font-weight="400" fill="#242622">از هر دو عکس بگیر؛ مقایسهٔ آن‌ها انتخاب بعدی را آسان‌تر می‌کند.</text><path d="M288 2490L1056 2490" stroke="#DADCD2" fill="none"/><text x="1056" y="2528" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="20" font-weight="600" fill="#242622">برای ساختن ترکیب خودت</text><text x="314" y="2528" direction="rtl" unicode-bidi="plaintext" text-anchor="end" font-family="Yekan" font-size="16" font-weight="600" fill="#4D593C">لباس‌های پایه را ببین</text><g transform="translate(288 2512) scale(0.8333333333333334)" fill="none" stroke="#4D593C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4 M10 6L4 12L10 18"/></g><g transform="translate(0 -100)"><rect x="0" y="2698" width="1440" height="262" rx="0" fill="#242622" stroke="none"/><text x="1376" y="2775" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="38" font-weight="700" fill="#F7F5EF">روزپوش</text><text x="1376" y="2814" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="400" fill="#D5D9CE">پوشاک روزمره، با نگاهی ساده‌تر.</text><text x="1376" y="2845" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="400" fill="#D5D9CE">همراه روزهای تو.</text><text x="866" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">خرید</text><text x="866" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">زنانه</text><text x="866" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">مردانه</text><text x="866" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">لباس‌های پایه</text><text x="578" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">راهنمای خرید</text><text x="578" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">اندازه و تن‌خور</text><text x="578" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">ارسال و تعویض</text><text x="578" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">پرسش‌های متداول</text><text x="290" y="2752" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="17" font-weight="600" fill="#F7F5EF">همراه روزپوش</text><text x="290" y="2790" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">دربارهٔ ما</text><text x="290" y="2820" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">تماس با ما</text><text x="290" y="2850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="14" font-weight="400" fill="#D5D9CE">پیگیری سفارش</text><path d="M64 2902L1376 2902" stroke="#4B5047" fill="none"/><text x="1376" y="2937" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Yekan" font-size="13" font-weight="400" fill="#D5D9CE">روزپوش © ۱۴۰۵</text><text x="64" y="2937" direction="rtl" unicode-bidi="plaintext" text-anchor="end" font-family="Yekan" font-size="13" font-weight="400" fill="#D5D9CE">حریم خصوصی  /  شرایط خرید</text></g></svg>